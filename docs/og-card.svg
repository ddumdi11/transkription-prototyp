<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Badge -->
  <rect x="420" y="96" width="360" height="44" rx="22" fill="#161b22" stroke="#2a3140"/>
  <text x="600" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" fill="#7ee787">Open-Source &#183; Python &#183; Prototyp</text>

  <!-- Headline -->
  <text x="600" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="82" font-weight="bold" fill="#e6edf3">Vom Diktiergerät</text>
  <text x="600" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="82" font-weight="bold" fill="url(#accent)">zum fertigen Text</text>

  <!-- Subtitle -->
  <text x="600" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="30" fill="#9aa7b5">Audio automatisch transkribieren — OpenAI-Cloud</text>
  <text x="600" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="30" fill="#9aa7b5">oder kostenlos &amp; privat lokal. Mit GUI und CLI.</text>

  <!-- URL -->
  <text x="600" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="24" fill="#6ea8fe">ddumdi11.github.io/transkription-prototyp</text>
</svg>
